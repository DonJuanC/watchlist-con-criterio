name: Sincronización Automática con Notion

on:
  schedule:
    # Corre automáticamente 2 veces al día: 05:00 UTC (00:00 hora Colombia) y 17:00 UTC (12:00 hora Colombia)
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      prune:
        description: 'Eliminar de Neon las películas borradas en Notion'
        required: false
        type: boolean
        default: false
      reembed:
        description: 'Regenerar embeddings con criterio enriquecido (director + reseña)'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Límite de películas a procesar (dejar vacío para procesar todo)'
        required: false
        type: string
        default: ''
      sync_target:
        description: 'Entorno de ejecución'
        required: false
        default: 'runner'
        type: choice
        options:
          - runner
          - render

jobs:
  sync-catalog:
    name: Sincronizar Notion y Generar Embeddings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Ejecutar vía API remota de Render (opcional)
        if: "${{ github.event.inputs.sync_target == 'render' }}"
        env:
          RENDER_API_URL: "https://watchlist-api-jy0u.onrender.com"
          SYNC_SECRET: ${{ secrets.SYNC_SECRET || secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$SYNC_SECRET" ]; then
            echo "❌ No se encontró SYNC_SECRET ni NOTION_TOKEN en los secrets de GitHub."
            exit 1
          fi
          echo "📡 Disparando sincronización en Render..."
          QUERY_PARAMS=""
          [ "${{ github.event.inputs.prune }}" = "true" ] && QUERY_PARAMS="${QUERY_PARAMS}&prune=true"
          [ "${{ github.event.inputs.reembed }}" = "true" ] && QUERY_PARAMS="${QUERY_PARAMS}&reembed=true"
          [ -n "${{ github.event.inputs.limit }}" ] && QUERY_PARAMS="${QUERY_PARAMS}&limit=${{ github.event.inputs.limit }}"
          QUERY_PARAMS="?${QUERY_PARAMS#&}"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $SYNC_SECRET" \
            "$RENDER_API_URL/api/sync$QUERY_PARAMS")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          echo "Respuesta de Render ($HTTP_STATUS): $HTTP_BODY"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 409 ]; then
            echo "✅ Sincronización completada con éxito en Render."
            exit 0
          else
            echo "❌ Render respondió con estado $HTTP_STATUS."
            exit 1
          fi

      - name: Validar secretos de GitHub Actions
        if: "${{ github.event.inputs.sync_target != 'render' }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MISSING=0
          check_secret() {
            if [ -z "$2" ]; then
              echo "  ❌ $1: NO configurado"
              MISSING=1
            else
              echo "  ✅ $1: Configurado"
            fi
          }
          echo "📋 Verificando variables requeridas en GitHub Secrets..."
          check_secret "DATABASE_URL" "$DATABASE_URL"
          check_secret "NOTION_TOKEN" "$NOTION_TOKEN"
          check_secret "NOTION_DATA_SOURCE_ID" "$NOTION_DATA_SOURCE_ID"
          check_secret "TMDB_API_KEY" "$TMDB_API_KEY"
          check_secret "GEMINI_API_KEY" "$GEMINI_API_KEY"

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "🚨 FALTAN SECRETOS EN GITHUB ACTIONS"
            echo "Para que la sincronización automática se ejecute en GitHub Actions,"
            echo "debes agregar los secretos faltantes marcados con ❌ en:"
            echo "👉 GitHub > Settings > Secrets and variables > Actions > Repository secrets"
            echo ""
            echo "Puedes copiar sus valores directamente desde tu archivo .env local."
            exit 1
          fi
          echo "✨ Todos los secretos requeridos están presentes."

      - name: Instalar dependencias
        if: "${{ github.event.inputs.sync_target != 'render' }}"
        run: npm ci --omit=dev

      - name: Ejecutar sincronización en el runner
        if: "${{ github.event.inputs.sync_target != 'render' }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DB_SSL_REJECT_UNAUTHORIZED: "false"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.prune }}" = "true" ]; then
            ARGS="$ARGS --prune"
          fi
          if [ "${{ github.event.inputs.reembed }}" = "true" ]; then
            ARGS="$ARGS --reembed"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi

          echo "🚀 Ejecutando sincronización de Notion hacia Neon..."
          node scripts/sync-notion.js $ARGS
