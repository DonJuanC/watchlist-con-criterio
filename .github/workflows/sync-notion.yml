name: Sincronización Automática con Notion

on:
  schedule:
    # Corre automáticamente 2 veces al día: 05:00 UTC (00:00 hora Colombia) y 17:00 UTC (12:00 hora Colombia)
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      prune:
        description: 'Eliminar de Neon las películas borradas en Notion'
        required: false
        type: boolean
        default: false

jobs:
  sync-catalog:
    name: Sincronizar Notion y Generar Embeddings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Sincronizar catálogo vía API de Render o Node.js
        env:
          RENDER_API_URL: "https://watchlist-api-jy0u.onrender.com"
          SYNC_SECRET: ${{ secrets.SYNC_SECRET || secrets.NOTION_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Si SYNC_SECRET o NOTION_TOKEN está configurado, dispara la sincronización en Render directamente
          if [ -n "$SYNC_SECRET" ]; then
            echo "📡 Disparando sincronización segura en Render..."
            PRUNE_PARAM=""
            if [ "${{ github.event.inputs.prune }}" = "true" ]; then
              PRUNE_PARAM="?prune=true"
            fi
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              -H "Authorization: Bearer $SYNC_SECRET" \
              "$RENDER_API_URL/api/sync$PRUNE_PARAM")
            HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
            HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
            echo "Respuesta ($HTTP_STATUS): $HTTP_BODY"
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 409 ]; then
              echo "✅ Sincronización completada con éxito en Render."
              exit 0
            else
              echo "⚠️ La llamada remota devolvió $HTTP_STATUS, verificando fallback directo con Node..."
            fi
          fi

          # Fallback: ejecutar script local si DATABASE_URL está en los secrets
          if [ -n "$DATABASE_URL" ] && [ -n "$NOTION_TOKEN" ]; then
            echo "⚙️ Ejecutando scripts/sync-notion.js en el runner..."
            npm ci --omit=dev
            if [ "${{ github.event.inputs.prune }}" = "true" ]; then
              node scripts/sync-notion.js --prune
            else
              node scripts/sync-notion.js
            fi
          else
            echo "❌ No se encontró SYNC_SECRET ni DATABASE_URL en los secrets de GitHub."
            echo "Configura SYNC_SECRET (o NOTION_TOKEN) en Settings > Secrets and variables > Actions para activar la sincronización automática."
            exit 1
          fi
